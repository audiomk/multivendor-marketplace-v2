<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Indaba Cart</title>
<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #F5F5F5;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .badge {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #006D6B;
    color: #FABB02;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 24px;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #666; margin: 0 0 24px; max-width: 320px; }
  button {
    background: #006D6B;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="badge">IC</div>
  <h1>You're offline</h1>
  <p>Check your connection and try again — prices and stock need a live connection to stay accurate.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
